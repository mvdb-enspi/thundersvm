name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libomp-dev libopenblas-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install cmake libomp openblas

    - name: Install the project
      run: uv sync

    - name: Build the project
      run: uv build .

    - name: Check installable from sdist
      run: |
        uv pip uninstall thundersvm --yes
        uv pip install dist/thundersvm-*.tar.gz
        uv run python -c "import thundersvm; print(thundersvm.__version__)"

    - name: Check installable from wheel
      run: |
        uv pip uninstall thundersvm --yes
        uv pip install dist/thundersvm-*.whl
        uv run python -c "import thundersvm; print(thundersvm.__version__)"
