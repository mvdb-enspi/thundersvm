[build-system]
requires = ["scikit-build-core>=0.10.7"]
build-backend = "scikit_build_core.build"

[project]
name = "thundersvm"
version = "0.4.0"
authors = [
  { name = "Zeyi Wen", email = "zeyi.wen@anu.edu.au" },
  { name = "Jianbin Qin", email = "jianbin.qin@anu.edu.au" },
  { name = "Mark van der Broek", email = "mark.van.der.broek@enspired-trading.com" },
]
description = "A fast SVM library on GPUs and CPUs"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "Apache-2.0" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = ["numpy", "scipy", "scikit-learn"]


[tool.scikit-build]
cmake.version = ">=3.15"
sdist.include = [
  "src/thundersvm/__init__.py",
  "src/thundersvm/thundersvm.py",
  "CMakeLists.txt",
  "src/thundersvm/cpp/**/*",
]
build-dir = "build"

[tool.scikit-build.cmake.define]
USE_CUDA = { env = "THUNDERSVM_USE_CUDA", default = "ON" }
BUILD_SHARED_LIBS = { env = "THUNDERSVM_BUILD_SHARED_LIBS", default = "ON" }
BUILD_TESTS = { env = "BUILD_TESTS", default = "OFF" }

[dependency-groups]
dev = ["pytest>=7.4.4", "pytest-cov>=4.1.0", "ruff>=0.9.4"]
